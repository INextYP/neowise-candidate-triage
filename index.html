<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    button:disabled { opacity: .6; }
    .notice { margin: 1rem 0; padding: .6rem .8rem; border-radius: .3rem; }
    .notice:empty { display: none; }
    .notice[data-kind="loading"] { background: #eef2f7; }
    .notice[data-kind="manual"], .notice[data-kind="invalid"] { background: #fff4d6; border: 1px solid #e0b84f; }
    .notice[data-kind="error"] { background: #fde8e8; border: 1px solid #d77; }
    .topic { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form novalidate>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <p id="notice" class="notice" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <p>Тема: <span id="topic" class="topic"></span></p>
    <label for="draft">Черновик ответа. Проверьте и поправьте перед отправкой клиенту.</label>
    <textarea id="draft" rows="5"></textarea>
    <button type="button" id="copy">Скопировать черновик</button>
  </section>

  <script type="module">
    import { INVALID_VIEW, LOADING_VIEW, toView } from "./triage-view.mjs";

    const CLIENT_TIMEOUT_MS = 5000;
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const submit = form.querySelector("button[type=submit]");
    const notice = document.querySelector("#notice");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const copy = document.querySelector("#copy");

    // Каждое состояние полностью перезаписывает экран, поэтому старый черновик не переживает сбой.
    function render(view) {
      notice.dataset.kind = view.kind;
      notice.textContent = view.message;
      topic.textContent = view.topic;
      draft.value = view.draft;
      result.hidden = view.kind !== "ready";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = message.value;
      if (text.trim() === "") {
        render(INVALID_VIEW);
        message.focus();
        return;
      }

      render(LOADING_VIEW);
      submit.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(CLIENT_TIMEOUT_MS),
        });
        const body = await reply.json().catch(() => null);
        render(toView(reply.status, body));
      } catch {
        render(toView(0, null));
      } finally {
        submit.disabled = false;
      }
    });

    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(draft.value);
        copy.textContent = "Скопировано";
      } catch {
        draft.select();
        copy.textContent = "Выделено, нажмите Ctrl+C";
      }
      setTimeout(() => { copy.textContent = "Скопировать черновик"; }, 1500);
    });
  </script>
</body>
</html>
